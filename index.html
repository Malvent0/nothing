<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NOTHING WS PROXY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0b0b14 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 22, 35, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 200, 255, 0.3);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 200, 255, 0.1) inset;
            padding: 2.5rem 2rem;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.01);
            border-color: rgba(0, 200, 255, 0.5);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #00ccff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
        }

        .description {
            color: #b9c7d9;
            font-size: 1rem;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 2rem;
        }

        .btn-proxy {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(95deg, #1e2a4a, #0f1428);
            padding: 1rem 2rem;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: white;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 1px solid #00ccffaa;
            box-shadow: 0 10px 20px -5px rgba(0, 150, 255, 0.3), 0 0 12px rgba(0, 210, 255, 0.4);
            width: 100%;
        }

        .btn-proxy:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #2a3c6e, #161d3a);
            border-color: #3bc9ff;
            box-shadow: 0 15px 25px -5px #00a6ff80, 0 0 18px cyan;
            text-shadow: 0 0 5px white;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #5a6e8a;
            border-top: 1px solid #1e2a3a;
            padding-top: 1.2rem;
        }

        @media (max-width: 500px) {
            .card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .btn-proxy {
                font-size: 1rem;
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>NOTHING WS PROXY</h1>
        
        <div class="description">
            Nothing WS Proxy (Nothing WebSocket Proxy) — это прокси-сервер для Telegram, который использует WebSocket вместо обычного TCP. Он маскирует трафик под обычный HTTPS-трафик веб-сайта.
        </div>

        <a href="https://t.me/nothingwsbot" target="_blank" rel="noopener noreferrer" class="btn-proxy">
            🔐 ПОДКЛЮЧИТЬ ПРОКСИ
        </a>

        <footer>
            © NOTHING WS PROXY • Обход блокировок • WebSocket
        </footer>
    </div>
</body>
</html>
